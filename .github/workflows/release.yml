name: Release

# Push a tag like v1.1.0 and this publishes the signed APK to GitHub Releases.
# The Android app reads that same release through the GitHub API, so the
# in-app updater has nothing else to configure.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Require a signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::AURORA_KEYSTORE_BASE64 is missing. A release signed with a different key cannot update installed copies."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_STORE_FILE=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"

      - name: Check the tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          AURORA_STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/aurora-$VERSION.apk"
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            **Aurora ${{ github.ref_name }}**

            Download `aurora-${{ env.VERSION }}.apk` below, or update from inside
            the app: **Profile → About Aurora → Check for updates**.

            Installed copies update themselves once a day and notify you when a
            newer version is ready.
